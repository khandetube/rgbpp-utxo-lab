#cloud-config
package_update: true
packages:
  - git
  - build-essential
  - pkg-config
  - libssl-dev
  - curl

users:
  - name: miner
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]

write_files:
  - path: /etc/rgbpp-utxo-lab/miner.env
    owner: root:root
    permissions: "0600"
    content: |
      STRATUM_URL=solo.ckpool.org:3333
      STRATUM_USERNAME=bc1qrwhe5l4wvx86g6rs4n3tpyr85j0xr3cs6lex4d
      STRATUM_PASSWORD=x
      MINER_THREADS=1
      STRATUM_RECONNECT_SECS=5

runcmd:
  - git clone https://github.com/khandetube/rgbpp-utxo-lab.git /opt/rgbpp-utxo-lab
  - cd /opt/rgbpp-utxo-lab && ./deploy/install-systemd.sh /opt/rgbpp-utxo-lab
  - systemctl enable --now rgbpp-stratum-miner
  - systemctl start rgbpp-stratum-watchdog.timer
