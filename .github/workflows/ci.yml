name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo check --workspace
      - name: Exercise real block submission and reward on isolated Regtest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bitcoind bitcoin-cli
          datadir="$RUNNER_TEMP/bitcoin-regtest"
          mkdir -p "$datadir"
          bitcoind -regtest -daemon -datadir="$datadir" -fallbackfee=0.0002
          for i in $(seq 1 30); do
            bitcoin-cli -regtest -datadir="$datadir" getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          bitcoin-cli -regtest -datadir="$datadir" getblockchaininfo >/dev/null
          bitcoin-cli -regtest -datadir="$datadir" createwallet "lab" >/dev/null
          cookie="$datadir/regtest/.cookie"
          export BITCOIN_TESTNET_RPC_USER="$(cut -d: -f1 "$cookie")"
          export BITCOIN_TESTNET_RPC_PASSWORD="$(cut -d: -f2- "$cookie")"
          payout_address="$(bitcoin-cli -regtest -datadir="$datadir" -rpcwallet=lab getnewaddress)"
          export BITCOIN_MINER_SCRIPT_PUBKEY="$(bitcoin-cli -regtest -datadir="$datadir" -rpcwallet=lab getaddressinfo "$payout_address" | python3 -c 'import json,sys; print(json.load(sys.stdin)["scriptPubKey"])')"
          export BITCOIN_TESTNET_RPC_URL="http://127.0.0.1:18443"
          export BITCOIN_TESTNET_SUBMIT="YES"
          export BITCOIN_TESTNET_CONFIRM="YES"
          export MAX_ATTEMPTS="100000"
          cargo run -p bitcoin-pow --bin testnet3_miner --release
          bitcoin-cli -regtest -datadir="$datadir" generatetoaddress 100 "$payout_address" >/dev/null
          balance="$(bitcoin-cli -regtest -datadir="$datadir" -rpcwallet=lab getbalance)"
          python3 - "$balance" <<'PY'
import decimal, sys
balance = decimal.Decimal(sys.argv[1])
assert balance > 0, f"expected positive regtest balance, got {balance}"
print(f"verified_regtest_wallet_balance={balance}")
PY
      - name: Verify live Bitcoin Testnet3 block header
        run: cargo run -p bitcoin-pow --bin bitcoin-pow --release
