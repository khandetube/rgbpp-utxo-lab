name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo check --workspace
      - name: Compile standalone Stratum miner
        run: cargo check -p bitcoin-pow --bin stratum-miner
      - name: Verify live Bitcoin Testnet3 block header
        run: cargo run -p bitcoin-pow --bin bitcoin-pow --release
