name: One-time Rust formatting

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'khandetube'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply rustfmt and push if needed
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "rustfmt_changes=false"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply rustfmt"
          git push
