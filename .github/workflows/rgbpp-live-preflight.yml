name: RGB++ Live Testnet Preflight

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "examples/rgbpp-ts/**"
      - ".github/workflows/rgbpp-live-preflight.yml"

jobs:
  public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: examples/rgbpp-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run public-preflight
