name: RGB++ Testnet API Preflight

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rgbpp-api-token-preflight.yml"
  workflow_dispatch:

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate ephemeral testnet token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 \
            -X POST "https://api.testnet.rgbpp.io/token/generate" \
            -H "Content-Type: application/json" \
            --data '{"app":"rgbpp-utxo-lab","domain":"khandetube.github.io"}')"
          token="$(printf '%s' "$response" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const x=JSON.parse(s);
              if (!x.token || !x.id) process.exit(2);
              process.stdout.write(x.token);
            });
          ')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "rgbpp_testnet_token_generation=ok"
